<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="projo-mcp">
  <!-- Eigenes Zeichen für projo-mcp (bewusst NICHT das projo-Logo): kleines „p“, dessen Bauch ein Zifferblatt ist. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- Schaft des „p“ -->
  <rect x="62" y="70" width="30" height="136" rx="15" fill="#e2e8f0"/>
  <!-- Bauch des „p“ = Zifferblatt -->
  <circle cx="136" cy="114" r="52" fill="none" stroke="url(#ring)" stroke-width="26"/>
  <!-- Zeiger -->
  <path d="M136 114 V84 M136 114 L157 126" fill="none" stroke="#e2e8f0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="136" cy="114" r="8" fill="#e2e8f0"/>
</svg>
